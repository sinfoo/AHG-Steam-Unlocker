    <!-- Tailwind is compiled at build time via @tailwindcss/postcss (src/index.css). The Play CDN was online-only, v3, and explicitly not for production. -->

    <style>
      :root {
        --violet: #8b5cf6;
        --violet-light: #a78bfa;
        --violet-dark: #7c3aed;
        --blue: #3b82f6;
        --cyan: #06b6d4;
        --pink: #ec4899;
        --amber: #f59e0b;
        --green: #10b981;
        --bg-deep: #030308;
        --bg-dark: #080810;
        --bg-card: #12121f;
        --bg-secondary: #0c0c18;
        --bg-hover: #1a1a2c;
        --text-muted: #94a3b8;
        --text-secondary: #cbd5e1;
        --text-primary: #f8fafc;
        --border-border: #2a2a44;
        --border-accent: #8b5cf6;
        --text-accent: #a78bfa;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #0a0a14;
        font-family: 'Geist Variable', 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      /* ───────── Splash (pre-React) — AHG v2 boot sequence ───────── */
      @property --sp-ang { syntax: '<angle>'; inherits: false; initial-value: 0deg }
      @keyframes sp-spinAng { from { --sp-ang: -30deg } to { --sp-ang: 330deg } } /* head starts top-left */
      @keyframes sp-wallIn { from { opacity: 0 } to { opacity: .6 } }
      @keyframes sp-coverIn { from { opacity: 0; transform: translateY(80px) rotateX(-50deg) scale(.85) } to { opacity: 1; transform: none } }
      @keyframes sp-colUp { from { transform: translateY(0) } to { transform: translateY(-14%) } }
      @keyframes sp-colDown { from { transform: translateY(-14%) } to { transform: translateY(0) } }
      @keyframes sp-glowPulse { 0%, 100% { opacity: .55; transform: scale(1) } 50% { opacity: .9; transform: scale(1.08) } }
      @keyframes sp-scan { from { transform: translateY(-140px) } to { transform: translateY(110vh) } }
      @keyframes sp-giantIn { from { opacity: 0; letter-spacing: .35em; transform: translateY(-50%) scale(1.08) } to { opacity: 1; letter-spacing: -.04em; transform: translateY(-50%) } }
      @keyframes sp-beam { 0% { transform: scaleX(0); opacity: 1 } 45% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
      @keyframes sp-burst { from { transform: scale(.4); opacity: 1 } to { transform: scale(3.2); opacity: 0 } }
      @keyframes sp-ringIn { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: none } }
      @keyframes sp-unfold { from { clip-path: inset(50% -60% 50% -60%); transform: scale(1.18) } to { clip-path: inset(-60% -60% -60% -60%); transform: none } }
      @keyframes sp-sheen { from { transform: translateX(-140%) skewX(-18deg) } to { transform: translateX(240%) skewX(-18deg) } }
      @keyframes sp-fadeIn { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sp-riseIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes sp-blink { 0% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes sp-flashLine { 0% { transform: scaleX(1); opacity: 0 } 25% { opacity: 1 } 100% { transform: scaleX(0); opacity: 0 } }

      #loadingScreen {
        --acc: #a77dff;
        position: fixed;
        inset: 36px 0 0 0; /* sits below the 36px title bar region (#spBar) */
        z-index: 9999;
        background: #04040a;
        overflow: hidden;
        color: #f3f2fa;
        cursor: pointer; /* click skips once loading has finished (see #loadingScreen click handler) */
        clip-path: inset(0 0 0 0);
        transition: clip-path .55s cubic-bezier(.7, 0, .25, 1);
      }
      #loadingScreen.closing { clip-path: inset(50% 0 50% 0); }
      #loadingScreen.closing { pointer-events: none; }
      #loadingScreen.hidden { display: none; }
      /* Minimal 36px title bar for the splash — mirrors src/components/TitleBar.tsx */
      #spBar { position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 10000; display: flex; align-items: center; background: #0f0f1b; border-bottom: 1px solid rgba(255,255,255,.06); user-select: none; -webkit-app-region: drag; }
      #spBar.hidden { display: none; }
      #spBar .sp-bar-label { display: flex; align-items: center; gap: 9px; margin-left: 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .18em; color: #77768e; }
      #spBar .sp-bar-label img { width: 18px; height: 18px; object-fit: contain; }
      #spBar .sp-bar-ctl { margin-left: auto; display: flex; height: 100%; -webkit-app-region: no-drag; }
      #spBar button { width: 46px; height: 100%; border: 0; background: transparent; color: #77768e; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .12s; }
      #spBar button:hover { background: rgba(255,255,255,.06); }
      #spBar button.x:hover { background: #ef4444; color: #fff; }
      #loadingScreen .mono { font-family: 'Geist Mono Variable', 'Geist Mono', ui-monospace, Consolas, monospace; }
      .sp-abs { position: absolute; }
      .sp-wall-wrap { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 35%; }
      .sp-wall {
        position: absolute; inset: -30% -20%; display: flex; gap: 18px;
        transform: rotateX(24deg) rotateZ(-9deg) scale(1.15);
        opacity: 0; animation: sp-wallIn 1.2s .1s ease forwards;
      }
      .sp-col { flex: 1; display: flex; flex-direction: column; gap: 18px; }
      .sp-tile {
        width: 100%; aspect-ratio: 2/3; border-radius: 14px; display: block;
        box-shadow: 0 20px 40px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
        animation: sp-coverIn .9s cubic-bezier(.16, 1, .3, 1) both;
      }
      .sp-vig { inset: 0; background: radial-gradient(ellipse 46% 42% at 50% 42%, rgba(4,4,10,.3) 0%, rgba(4,4,10,.82) 70%, #04040a 100%); }
      .sp-floor { left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(0deg, #04040a 20%, transparent); }
      .sp-glow { inset: 0; background: radial-gradient(circle at 50% 42%, color-mix(in oklch, var(--acc) 32%, transparent) 0%, transparent 34%); animation: sp-glowPulse 4s ease-in-out infinite; }
      .sp-scan { left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(180deg, transparent, color-mix(in oklch, var(--acc) 9%, transparent), transparent); animation: sp-scan 3.4s linear infinite; }
      .sp-giant {
        left: 0; right: 0; top: 42%; text-align: center; font-size: clamp(220px, 32vw, 560px); font-weight: 800; line-height: 1;
        color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.08); white-space: nowrap;
        animation: sp-giantIn 2.2s .15s cubic-bezier(.16, 1, .3, 1) both;
      }
      .sp-center { left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
      .sp-logo { position: relative; width: 168px; height: 168px; }
      .sp-beam { position: absolute; left: 50%; top: 50%; width: 100vw; height: 1px; margin-left: -50vw; background: linear-gradient(90deg, transparent, var(--acc) 30%, #fff 50%, var(--acc) 70%, transparent); box-shadow: 0 0 18px var(--acc); animation: sp-beam 1.2s .1s cubic-bezier(.7, 0, .2, 1) both; }
      .sp-burst { position: absolute; inset: 0; border-radius: 50%; }
      .sp-conic {
        position: absolute; inset: -16px; border-radius: 48px; padding: 1.5px;
        background: conic-gradient(from var(--sp-ang), transparent 0deg, transparent 220deg, color-mix(in oklch, var(--acc) 80%, transparent) 300deg, #fff 345deg, transparent 360deg);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        animation: sp-spinAng 2.4s linear infinite, sp-ringIn .6s .95s cubic-bezier(.16, 1, .3, 1) both;
      }
      .sp-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 20px 50px color-mix(in oklch, var(--acc) 70%, transparent)); animation: sp-unfold .9s .5s cubic-bezier(.16, 1, .3, 1) both; }
      .sp-sheen { position: absolute; inset: 8px; border-radius: 34px; overflow: hidden; }
      .sp-sheen i { position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation: sp-sheen 1.1s 1.3s cubic-bezier(.6, 0, .2, 1) both; }
      .sp-title { margin-top: 36px; font-size: 14px; font-weight: 500; letter-spacing: .55em; padding-left: .55em; color: #fff; white-space: pre; animation: sp-fadeIn .3s .45s both; }
      .sp-br { position: absolute; width: 18px; height: 18px; border: 0 solid rgba(255,255,255,.35); animation: sp-fadeIn .5s .3s both; }
      .sp-br.tl { top: 22px; left: 22px; border-top-width: 1.5px; border-left-width: 1.5px; }
      .sp-br.tr { top: 22px; right: 22px; border-top-width: 1.5px; border-right-width: 1.5px; }
      .sp-br.bl { bottom: 22px; left: 22px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
      .sp-br.brr { bottom: 22px; right: 22px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
      .sp-tag { position: absolute; top: 25px; font-size: 10.5px; color: #77768e; animation: sp-fadeIn .5s .4s both; }
      .sp-foot { position: absolute; left: 52px; right: 52px; bottom: 44px; display: flex; align-items: flex-end; gap: 56px; animation: sp-riseIn .5s .7s cubic-bezier(.16, 1, .3, 1) both; }
      .sp-pct { flex: none; width: 320px; }
      .sp-pct-n { font-size: 76px; font-weight: 500; line-height: .85; letter-spacing: -.05em; color: #fff; display: flex; align-items: flex-start; font-variant-numeric: tabular-nums; }
      .sp-pct-n small { font-size: 20px; color: var(--acc); margin: 6px 0 0 8px; letter-spacing: 0; }
      .sp-status { font-size: 11.5px; color: #a6a5bb; margin-top: 14px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sp-status i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc); animation: sp-blink 1s steps(1) infinite; }
      .sp-stages { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding-bottom: 3px; }
      .sp-stage { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
      .sp-stage span { font-size: 10px; letter-spacing: .14em; color: #55546a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s; }
      .sp-stage.on span { color: #fff; }
      .sp-stage.done span { color: #c9c8da; }
      .sp-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      .sp-bar b { display: block; height: 100%; width: 0; background: var(--acc); box-shadow: 0 0 10px var(--acc); transition: width .1s linear; }
      .sp-tip { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: .24em; color: #55546a; animation: sp-fadeIn .8s 1.4s backwards; }
      .sp-flash { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; z-index: 2; background: #fff; box-shadow: 0 0 30px var(--acc), 0 0 90px var(--acc); opacity: 0; }
      #loadingScreen.closing .sp-flash { animation: sp-flashLine .8s ease both; }
      @media (max-width: 760px) { .sp-foot { left: 24px; right: 24px; gap: 20px; flex-direction: column; align-items: stretch; } .sp-pct { width: auto; } .sp-stage span { font-size: 8px; } .sp-tag.r { display: none; } }
      @media (prefers-reduced-motion: reduce) {
        #loadingScreen *, #loadingScreen { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }

      /* Splash keeps a fixed LTR layout in every language (text still shapes/bidi-orders itself); Arabic must not be letter-spaced */
      #loadingScreen, #spBar { direction: ltr; }
      html[lang='ar'] #loadingScreen *, html[lang='ar'] #spBar * { letter-spacing: 0 !important; }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>

  <body>
    <div id="spBar">
      <div class="sp-bar-label"><img src="/assets/ahg-logo.png" alt="" /><span>AHG UNLOCKER</span></div>
      <div class="sp-bar-ctl">
        <button data-sp-title="min" title="Minimize" onclick="window.electronAPI&&window.electronAPI.minimizeWindow&&window.electronAPI.minimizeWindow()"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="5.5" width="10" height="1" rx=".5" fill="currentColor"/></svg></button>
        <button data-sp-title="max" title="Maximize" onclick="window.electronAPI&&window.electronAPI.maximizeWindow&&window.electronAPI.maximizeWindow()"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="x" data-sp-title="close" title="Close" onclick="window.electronAPI&&window.electronAPI.closeWindow&&window.electronAPI.closeWindow()"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div id="loadingScreen">
      <div class="sp-wall-wrap"><div class="sp-wall" id="spWall"></div></div>
      <div class="sp-abs sp-vig"></div>
      <div class="sp-abs sp-floor"></div>
      <div class="sp-abs sp-glow"></div>
      <div class="sp-abs sp-scan"></div>
      <div class="sp-abs sp-giant">AHG</div>

      <div class="sp-abs sp-center">
        <div class="sp-logo">
          <div class="sp-beam"></div>
          <div class="sp-burst" style="border:2px solid var(--acc);animation:sp-burst 1.1s .7s ease-out both"></div>
          <div class="sp-burst" style="border:1px solid #fff;animation:sp-burst 1.3s .85s ease-out both"></div>
          <div class="sp-conic"></div>
          <img src="/assets/ahg-logo.png" alt="" />
          <div class="sp-sheen"><i></i></div>
        </div>
        <div class="sp-title mono" id="spTitle">AHG UNLOCKER</div>
      </div>

      <span class="sp-br tl"></span><span class="sp-br tr"></span><span class="sp-br bl"></span><span class="sp-br brr"></span>
      <div class="sp-tag mono" data-sp="boot" style="left:52px;letter-spacing:.2em">AHG // BOOT SEQUENCE</div>
      <div class="sp-tag mono r" data-sp="dev" data-pre="v1.0 • " style="right:52px;letter-spacing:.12em">v1.0 • Developed by sinfo</div>

      <div class="sp-foot mono">
        <div class="sp-pct">
          <div class="sp-pct-n"><span id="percentText">000</span><small>%</small></div>
          <div class="sp-status"><i></i><span id="spStatus">Initializing core</span></div>
        </div>
        <div class="sp-stages" id="spStages"></div>
      </div>
      <div class="sp-tip mono" id="bootTipText" data-sp="tip">CLICK ANYWHERE TO SKIP</div>
      <div class="sp-flash"></div>
    </div>

    <script>
      // Fullscreen on double-click
      document.addEventListener('DOMContentLoaded', () => {
        document.body.addEventListener('dblclick', () => {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
          else document.exitFullscreen?.();
        });
      });

      // ── Poster wall: gradient tiles (fully offline, no images) ──
      (function () {
        const wall = document.getElementById('spWall');
        let html = '';
        // 16 posters bundled in /assets/posters (offline-safe); gradient tiles stay underneath while they decode.
        let k = 0;
        for (let c = 0; c < 8; c++) {
          html += '<div class="sp-col" style="animation:' + (c % 2 ? 'sp-colDown' : 'sp-colUp') + ' ' + (22 + c * 3) + 's ease-in-out infinite alternate">';
          for (let r = 0; r < 6; r++) {
            const h = (c * 47 + r * 61 + 240) % 360;
            const grad = 'linear-gradient(160deg,hsl(' + h + ' 55% 34%),hsl(' + ((h + 50) % 360) + ' 60% 14%))';
            const bg = 'url(./assets/posters/p' + ((c * 5 + r * 3 + k++) % 16) + '.webp) center/cover,' + grad;
            html += '<div class="sp-tile" style="background:' + bg + ';animation-delay:' + (0.15 + c * 0.07 + r * 0.06).toFixed(2) + 's"></div>';
          }
          html += '</div>';
        }
        wall.innerHTML = html;
      })();

      // ── Splash strings (pre-React): language from localStorage('ahg.lang'), same codes as src/i18n ──
      const SP = {
        en: { st: ['CORE', 'DATABASE', 'COVERS', 'MIRRORS', 'STEAM', 'INTERFACE', 'READY'], ms: ['Initializing core', 'Loading games database', 'Warming cover cache', 'Syncing mirrors', 'Detecting Steam library', 'Building interface', 'Ready'], tip: 'CLICK ANYWHERE TO SKIP', boot: 'AHG // BOOT SEQUENCE', dev: 'Developed by sinfo', min: 'Minimize', max: 'Maximize', close: 'Close' },
        es: { st: ['NÚCLEO', 'BASE DE DATOS', 'PORTADAS', 'MIRRORS', 'STEAM', 'INTERFAZ', 'LISTO'], ms: ['Iniciando el núcleo', 'Cargando la base de datos de juegos', 'Calentando la caché de portadas', 'Sincronizando mirrors', 'Detectando la biblioteca de Steam', 'Construyendo la interfaz', 'Listo'], tip: 'HAZ CLIC EN CUALQUIER LUGAR PARA OMITIR', boot: 'AHG // SECUENCIA DE ARRANQUE', dev: 'Desarrollado por sinfo', min: 'Minimizar', max: 'Maximizar', close: 'Cerrar' },
        fr: { st: ['NOYAU', 'BASE DE DONNÉES', 'JAQUETTES', 'MIRRORS', 'STEAM', 'INTERFACE', 'PRÊT'], ms: ['Initialisation du noyau', 'Chargement de la base de jeux', 'Préchauffage du cache des jaquettes', 'Synchronisation des miroirs', 'Détection de la bibliothèque Steam', 'Construction de l’interface', 'Prêt'], tip: 'CLIQUEZ N’IMPORTE OÙ POUR PASSER', boot: 'AHG // SÉQUENCE DE DÉMARRAGE', dev: 'Développé par sinfo', min: 'Réduire', max: 'Agrandir', close: 'Fermer' },
        de: { st: ['KERN', 'DATENBANK', 'COVER', 'MIRRORS', 'STEAM', 'OBERFLÄCHE', 'BEREIT'], ms: ['Kern wird initialisiert', 'Spieledatenbank wird geladen', 'Cover-Cache wird aufgewärmt', 'Mirrors werden synchronisiert', 'Steam-Bibliothek wird erkannt', 'Oberfläche wird aufgebaut', 'Bereit'], tip: 'ZUM ÜBERSPRINGEN IRGENDWO KLICKEN', boot: 'AHG // STARTSEQUENZ', dev: 'Entwickelt von sinfo', min: 'Minimieren', max: 'Maximieren', close: 'Schließen' },
        pt: { st: ['NÚCLEO', 'BANCO DE DADOS', 'CAPAS', 'MIRRORS', 'STEAM', 'INTERFACE', 'PRONTO'], ms: ['Inicializando o núcleo', 'Carregando o banco de dados de jogos', 'Aquecendo o cache de capas', 'Sincronizando mirrors', 'Detectando a biblioteca do Steam', 'Construindo a interface', 'Pronto'], tip: 'CLIQUE EM QUALQUER LUGAR PARA PULAR', boot: 'AHG // SEQUÊNCIA DE INICIALIZAÇÃO', dev: 'Desenvolvido por sinfo', min: 'Minimizar', max: 'Maximizar', close: 'Fechar' },
        tr: { st: ['ÇEKİRDEK', 'VERİTABANI', 'KAPAKLAR', 'YANSILAR', 'STEAM', 'ARAYÜZ', 'HAZIR'], ms: ['Çekirdek başlatılıyor', 'Oyun veritabanı yükleniyor', 'Kapak önbelleği ısıtılıyor', 'Yansılar eşitleniyor', 'Steam kütüphanesi algılanıyor', 'Arayüz oluşturuluyor', 'Hazır'], tip: 'ATLAMAK İÇİN HERHANGİ BİR YERE TIKLAYIN', boot: 'AHG // AÇILIŞ DİZİSİ', dev: 'Geliştiren: sinfo', min: 'Küçült', max: 'Büyüt', close: 'Kapat' },
        zh: { st: ['核心', '数据库', '封面', '镜像', 'STEAM', '界面', '就绪'], ms: ['正在初始化核心', '正在加载游戏数据库', '正在预热封面缓存', '正在同步镜像', '正在检测 Steam 游戏库', '正在构建界面', '就绪'], tip: '点击任意位置跳过', boot: 'AHG // 启动序列', dev: '开发者 sinfo', min: '最小化', max: '最大化', close: '关闭' },
        ar: { st: ['النواة', 'قاعدة البيانات', 'الأغلفة', 'المرايا', 'STEAM', 'الواجهة', 'جاهز'], ms: ['جارٍ تهيئة النواة', 'جارٍ تحميل قاعدة بيانات الألعاب', 'جارٍ تسخين ذاكرة الأغلفة', 'جارٍ مزامنة المرايا', 'جارٍ اكتشاف مكتبة Steam', 'جارٍ بناء الواجهة', 'جاهز'], tip: 'انقر في أي مكان للتخطي', boot: 'AHG // تسلسل الإقلاع', dev: 'تطوير sinfo', min: 'تصغير', max: 'تكبير', close: 'إغلاق' },
      };
      const SPL = SP[document.documentElement.lang] || SP.en;
      document.querySelectorAll('[data-sp]').forEach((el) => { el.textContent = (el.dataset.pre || '') + SPL[el.dataset.sp]; });
      document.querySelectorAll('[data-sp-title]').forEach((el) => { el.title = SPL[el.dataset.spTitle]; });

      // ── Stages mapped onto the real progress percentage ──
      const STAGES = SPL.st.map((n, i) => [n, SPL.ms[i]]);
      const stagesEl = document.getElementById('spStages');
      stagesEl.innerHTML = STAGES.map((s) => '<div class="sp-stage"><span>' + s[0] + '</span><div class="sp-bar"><b></b></div></div>').join('');
      const stageEls = Array.from(stagesEl.children);
      const stageBars = stageEls.map((el) => el.querySelector('b'));
      const percentText = document.getElementById('percentText');
      const statusText = document.getElementById('spStatus');
      const loadingScreen = document.getElementById('loadingScreen');
      let lastStage = -1;

      // Real progress only sets a TARGET; the displayed counter eases up through every number and can't
      // finish before MIN_MS, so the splash never flashes by.
      const MIN_MS = 4500;
      let lastPct = 0, target = 0, shown = 0, pendingMsg, hiding = false;
      function setProgress(pct, msg) {
        target = Math.max(target, Math.max(0, Math.min(100, pct)));
        if (msg) pendingMsg = msg;
      }
      function render(pct, msg) {
        lastPct = pct;
        percentText.textContent = String(Math.round(pct)).padStart(3, '0');
        const per = 100 / STAGES.length;
        // READY only lights once we hit 100%
        const cur = pct >= 100 ? STAGES.length - 1 : Math.min(STAGES.length - 2, Math.floor(pct / per));
        for (let i = 0; i < STAGES.length; i++) {
          const fill = pct >= 100 ? 100 : Math.max(0, Math.min(100, ((pct - i * per) / per) * 100));
          stageBars[i].style.width = (i === STAGES.length - 1 ? (pct >= 100 ? 100 : 0) : fill) + '%';
          stageEls[i].className = 'sp-stage' + (i < cur ? ' done' : i === cur ? ' on' : '');
        }
        if (msg) { statusText.textContent = msg; lastStage = -1; }
        else if (cur !== lastStage) {
          lastStage = cur;
          statusText.textContent = STAGES[cur][1];
        }
      }
      render(0);
      // Virtual clock: a long main-thread stall (catalogue IPC/clone) must not make the counter leap,
      // so each frame advances by at most 34ms of "splash time" and the number resumes where it froze.
      let vt = 0, prev = performance.now();
      (function tick(now) {
        const dt = Math.min(now - prev, 34); prev = now; vt += dt;
        const cap = Math.min(100, (vt / MIN_MS) * 100);
        const goal = Math.min(target, cap);
        if (goal > shown) shown = Math.min(goal, shown + Math.min(Math.max(0.05, (goal - shown) * 0.04), 0.5 * (dt / 16.7)));
        const r = Math.floor(shown + 0.001);
        if (r !== Math.floor(lastPct) || pendingMsg) { render(r >= 100 && shown < 100 ? 99 : r, pendingMsg); pendingMsg = undefined; }
        if (hiding && shown >= 99.99) { hiding = false; closeSplash(); }
        requestAnimationFrame(tick);
      })(prev);

      // ── Title scramble ──
      (function () {
        const el = document.getElementById('spTitle');
        const target = 'AHG UNLOCKER';
        const pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&';
        let n = 0;
        const t = setInterval(() => {
          n++;
          el.textContent = target.split('').map((ch, i) => (ch === ' ' || i < n / 2 ? ch : pool[Math.floor(Math.random() * pool.length)])).join('');
          if (n / 2 >= target.length) { clearInterval(t); el.textContent = target; }
        }, 45);
      })();

      function easeOutExpo(t) {
        return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
      }

      // Initial ramp-up animation — brief flash while React mounts
      function animateInitialProgress() {
        const startTime = performance.now();
        const duration = 600;
        const targetPct = 15;

        function frame(now) {
          const t = Math.min((now - startTime) / duration, 1);
          setProgress(Math.round(easeOutExpo(t) * targetPct));

          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            // Signal React to start loading games — React sends real progress updates
            window.dispatchEvent(new CustomEvent('splash-complete'));
            window.__splashCompleted = true;
            window.addEventListener('progress-update', (e) => {
              setProgress(Math.max(targetPct, e.detail.percent), e.detail.message);
            });
          }
        }

        requestAnimationFrame(frame);
      }

      // React dispatches this event when games are loaded and the main app is ready
      window.addEventListener('hide-splash', () => { target = 100; hiding = true; });
      function closeSplash() {
        render(100);
        // Collapse to a line (design: clip-path close + flash), then remove from layout
        loadingScreen.classList.add('closing');
        setTimeout(() => { loadingScreen.classList.add('hidden'); document.getElementById('spBar').classList.add('hidden'); }, 600);
      }

      // Click anywhere to skip the closing animation — only once loading has actually finished (never interrupts the load protocol)
      loadingScreen.addEventListener('click', () => {
        if (lastPct >= 100 && !loadingScreen.classList.contains('hidden')) closeSplash();
      });

      // Start immediately
      animateInitialProgress();
    </script>

    <div id="root"></div>
  </body>
</html>
