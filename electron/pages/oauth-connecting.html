<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting - AHG Unlocker</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#030308;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;overflow:hidden}.card{background:linear-gradient(180deg,rgba(15,15,30,.95) 0%,rgba(5,5,15,.98) 100%);border:1px solid rgba(139,92,246,.2);border-radius:32px;padding:60px 48px 48px;text-align:center;max-width:440px;width:90%;box-shadow:0 0 80px rgba(139,92,246,.15)}.spinner{width:40px;height:40px;border:3px solid rgba(139,92,246,.2);border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#a78bfa,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0 0 8px}p{font-size:15px;color:#94a3b8;margin:0;line-height:1.5}</style></head><body><div class="card"><div class="spinner"></div><h1>Connecting...</h1><p>Waiting for Discord authorization<br>in your browser.</p></div></body></html>
